<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory Match | Pocket Arcade</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b1020;color:#eef4ff;font:16px system-ui,sans-serif;display:flex;justify-content:center;padding:24px}.wrap{width:min(95vw,620px)}a{color:#9bb5ff;text-decoration:none}h1{margin:12px 0 4px;font-size:32px}.muted{color:#aab5d0;margin:0 0 18px}.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.pill{background:#182440;border:1px solid #304061;padding:8px 12px;border-radius:12px}.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.card{aspect-ratio:1;border:1px solid #304061;border-radius:14px;background:linear-gradient(140deg,#283b66,#182440);color:#eef4ff;font-size:clamp(24px,7vw,42px);display:grid;place-items:center;cursor:pointer;transition:transform .12s,background .12s;box-shadow:0 5px 12px #0002}.card:hover{transform:translateY(-2px)}.card.open,.card.matched{background:#dce7ff;color:#15203b;border-color:#dce7ff}.card.matched{background:#7cf0cf;color:#091020}.card:disabled{cursor:default}button.reset{margin-top:16px;border:0;border-radius:11px;padding:11px 15px;background:#7cf0cf;color:#091020;font:inherit;font-weight:800;cursor:pointer}.status{min-height:24px;margin-top:12px;color:#aab5d0;font-size:14px}
</style></head><body><main class="wrap"><a href="../">← Arcade home</a><h1>🃏 Memory Match</h1><p class="muted">Turn over two cards at a time. Find all eight pairs.</p><div class="stats"><span class="pill">Moves: <b id="moves">0</b></span><span class="pill">Matched: <b id="matched">0</b>/8</span><span class="pill">Time: <b id="time">0</b>s</span></div><div class="board" id="board"></div><button class="reset" id="reset">New game</button><div class="status" id="status">Find matching pairs!</div></main><script>
const icons=['🍉','🚀','🎸','🐙','🌟','🍕','🦊','⚽'];let deck=[],first=null,lock=false,moves=0,matched=0,seconds=0,started=false,clock;const board=document.getElementById('board'),status=document.getElementById('status');
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function begin(){clearInterval(clock);deck=shuffle([...icons,...icons].map((icon,id)=>({icon,id,open:false,matched:false})));first=null;lock=false;moves=0;matched=0;seconds=0;started=false;document.getElementById('moves').textContent='0';document.getElementById('matched').textContent='0';document.getElementById('time').textContent='0';status.textContent='Find matching pairs!';render()}
function render(){board.innerHTML='';deck.forEach((item,i)=>{const b=document.createElement('button');b.className='card'+(item.open?' open':'')+(item.matched?' matched':'');b.textContent=item.open||item.matched?item.icon:'?';b.setAttribute('aria-label',item.open||item.matched?item.icon:'Hidden card');b.disabled=item.matched;b.onclick=()=>flip(i);board.appendChild(b)})}
function flip(i){if(lock||deck[i].open||deck[i].matched)return;if(!started){started=true;clock=setInterval(()=>{seconds++;document.getElementById('time').textContent=seconds},1000)}deck[i].open=true;render();if(first===null){first=i;return}moves++;document.getElementById('moves').textContent=moves;if(deck[first].icon===deck[i].icon){deck[first].matched=deck[i].matched=true;matched++;document.getElementById('matched').textContent=matched;first=null;render();if(matched===8){clearInterval(clock);status.textContent='You matched every pair in '+moves+' moves!'}}else{lock=true;const prev=first;first=null;setTimeout(()=>{deck[prev].open=false;deck[i].open=false;lock=false;render()},700)}}
document.getElementById('reset').onclick=begin;begin();
</script></body></html>
