<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snake | Pocket Arcade</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b1020;color:#eef4ff;font:16px system-ui,sans-serif;display:flex;justify-content:center;padding:24px}.wrap{width:min(95vw,620px)}a{color:#9bb5ff;text-decoration:none}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}h1{margin:12px 0 5px;font-size:32px}.muted{color:#aab5d0;margin:0 0 16px}.score{display:flex;gap:10px}.pill{background:#182440;border:1px solid #304061;padding:8px 13px;border-radius:12px;font-weight:700}canvas{display:block;width:100%;height:auto;border-radius:15px;border:1px solid #304061;background:#0f1729;touch-action:none}button{border:0;border-radius:11px;padding:11px 15px;background:#7cf0cf;color:#091020;font:inherit;cursor:pointer}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0}.arrows{display:grid;grid-template-columns:repeat(3,46px);gap:6px;justify-content:center;margin:15px auto}.arrows button{padding:8px}.arrows .blank{visibility:hidden}.note{font-size:13px;color:#aab5d0}
</style></head><body><main class="wrap"><a href="../">← Arcade home</a><div class="head"><div><h1>🐍 Snake</h1><p class="muted">Eat the glowing dots. Don't hit the wall or yourself.</p></div><div class="score"><span class="pill">Score: <span id="score">0</span></span><span class="pill">Best: <span id="best">0</span></span></div></div><canvas id="board" width="600" height="600" aria-label="Snake game"></canvas><div class="controls"><button id="start">Start / Restart</button><span class="note">Arrow keys or WASD · Space to pause</span></div><div class="arrows"><button class="blank"> </button><button data-dir="up">▲</button><button class="blank"> </button><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div><p class="note" id="status">Press Start or an arrow key to begin.</p></main><script>
const c=document.getElementById('board'),ctx=c.getContext('2d'),N=20,C=30;let snake,dir,next,food,score,alive,running,timer;
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),statusEl=document.getElementById('status');let best=Number(localStorage.getItem('pocket-arcade-snake-best')||0);bestEl.textContent=best;
function randFood(){let p;do{p={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(s=>s.x===p.x&&s.y===p.y));return p}
function start(){clearInterval(timer);snake=[{x:9,y:10},{x:8,y:10},{x:7,y:10}];dir={x:1,y:0};next={...dir};food=randFood();score=0;alive=true;running=true;scoreEl.textContent=score;statusEl.textContent='Playing — collect the glowing dot!';draw();timer=setInterval(tick,115)}
function setDir(name){const d={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}}[name];if(d&&!(d.x===-dir.x&&d.y===-dir.y)){next=d;if(!running&&!alive)start();else if(!running){start();next=d}}}
function tick(){if(!running||!alive)return;dir=next;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(head.x<0||head.y<0||head.x>=N||head.y>=N||snake.some((s,i)=>i<snake.length-1&&s.x===head.x&&s.y===head.y)){alive=false;statusEl.textContent='Game over! Press Start / Restart to play again.';draw();return}snake.unshift(head);if(head.x===food.x&&head.y===food.y){score+=10;scoreEl.textContent=score;if(score>best){best=score;bestEl.textContent=best;localStorage.setItem('pocket-arcade-snake-best',best)}food=randFood()}else snake.pop();draw()}
function draw(){ctx.fillStyle='#0f1729';ctx.fillRect(0,0,600,600);ctx.strokeStyle='#1d2a43';for(let i=0;i<=N;i++){ctx.beginPath();ctx.moveTo(i*C,0);ctx.lineTo(i*C,600);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*C);ctx.lineTo(600,i*C);ctx.stroke()}if(food){ctx.fillStyle='#ffcc66';ctx.shadowColor='#ffcc66';ctx.shadowBlur=14;ctx.beginPath();ctx.arc(food.x*C+C/2,food.y*C+C/2,10,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}if(snake)snake.forEach((s,i)=>{ctx.fillStyle=i===0?'#7cf0cf':'#5fc7b1';ctx.beginPath();ctx.roundRect(s.x*C+3,s.y*C+3,C-6,C-6,7);ctx.fill()});if(!running||!alive){ctx.fillStyle='#0b1020bb';ctx.fillRect(0,0,600,600);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 30px system-ui';ctx.fillText(alive?'SNAKE':'GAME OVER',300,285);ctx.font='16px system-ui';ctx.fillText('Press Start / Restart',300,320)}}
document.getElementById('start').onclick=start;document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>setDir(b.dataset.dir));
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase(),map={arrowup:'up',w:'up',arrowdown:'down',s:'down',arrowleft:'left',a:'left',arrowright:'right',d:'right'};if(map[k]){e.preventDefault();setDir(map[k])}if(e.code==='Space'){e.preventDefault();if(running){running=false;statusEl.textContent='Paused — press Space to resume.'}else if(alive){running=true;statusEl.textContent='Playing';}}});
draw();
</script></body></html>
