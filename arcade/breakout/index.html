<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brick Breaker | Pocket Arcade</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b1020;color:#eef4ff;font:16px system-ui,sans-serif;display:flex;justify-content:center;padding:24px}.wrap{width:min(95vw,760px)}a{color:#9bb5ff;text-decoration:none}h1{margin:12px 0 5px}.muted,.note{color:#aab5d0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}.pill{border:1px solid #304061;border-radius:10px;padding:7px 12px;background:#182440}canvas{width:100%;height:auto;border:1px solid #304061;border-radius:14px;background:#10172a;touch-action:pan-y;display:block}button{border:0;border-radius:11px;padding:10px 14px;background:#7cf0cf;color:#091020;font:inherit;font-weight:800;cursor:pointer;margin:13px 8px 0 0}.note{font-size:13px}
</style></head><body><main class="wrap"><a href="../">← Arcade home</a><h1>🏓 Brick Breaker</h1><p class="muted">Bounce the ball into every brick. Don't let it pass your paddle.</p><div class="row"><span class="pill">Score: <b id="score">0</b></span><span class="pill">Lives: <b id="lives">3</b></span><span class="note">Move with ← →, A/D, mouse, or touch · Space to launch</span></div><canvas id="game" width="720" height="500"></canvas><button id="reset">Restart</button><span class="note" id="status">Move the paddle and press Space or click to launch.</span></main><script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let paddle,ball,bricks,score,lives,launched,over,keys={},last=0,raf=0;const cols=9,rows=5,bw=66,bh=20,gap=9,left=18,top=54;
function reset(){cancelAnimationFrame(raf);paddle={x:300,y:460,w:120,h:13};ball={x:360,y:440,r:8,vx:3.1,vy:-3.8};bricks=[];for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)bricks.push({x:left+c*(bw+gap),y:top+r*(bh+gap),w:bw,h:bh,alive:true,color:['#ff7a90','#ffb86b','#ffe27a','#7cf0cf','#7c9cff'][r]});score=0;lives=3;launched=false;over=false;last=0;document.getElementById('score').textContent=0;document.getElementById('lives').textContent=3;document.getElementById('status').textContent='Press Space or click to launch.';draw();raf=requestAnimationFrame(loop)}
function launch(){if(over){reset();return}if(!launched){launched=true;ball.vx=(Math.random()<.5?-1:1)*3.1;ball.vy=-3.8;document.getElementById('status').textContent='Break all the bricks!'}}
function key(e,down){keys[e.code]=down;if(down&&(e.code==='Space'||e.code==='ArrowUp')){e.preventDefault();launch()}}
document.addEventListener('keydown',e=>key(e,true));document.addEventListener('keyup',e=>key(e,false));canvas.addEventListener('pointermove',e=>{const r=canvas.getBoundingClientRect();paddle.x=(e.clientX-r.left)*canvas.width/r.width-paddle.w/2;paddle.x=Math.max(0,Math.min(canvas.width-paddle.w,paddle.x))});canvas.addEventListener('pointerdown',launch);document.getElementById('reset').onclick=reset;
function update(dt){if(over)return;if(keys.ArrowLeft||keys.KeyA)paddle.x-=420*dt;if(keys.ArrowRight||keys.KeyD)paddle.x+=420*dt;paddle.x=Math.max(0,Math.min(canvas.width-paddle.w,paddle.x));if(!launched){ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r-2;return}ball.x+=ball.vx*dt*60;ball.y+=ball.vy*dt*60;if(ball.x<ball.r||ball.x>canvas.width-ball.r)ball.vx*=-1;if(ball.y<ball.r)ball.vy=Math.abs(ball.vy);if(ball.vy>0&&ball.y+ball.r>=paddle.y&&ball.y-ball.r<=paddle.y+paddle.h&&ball.x>=paddle.x&&ball.x<=paddle.x+paddle.w){const hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);ball.vx=hit*4.8;ball.vy=-Math.max(3.2,Math.sqrt(30-ball.vx*ball.vx))}
for(const b of bricks){if(!b.alive)continue;if(ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){b.alive=false;score+=10;document.getElementById('score').textContent=score;ball.vy*=-1;break}}
if(ball.y>canvas.height+ball.r){lives--;document.getElementById('lives').textContent=lives;if(lives<=0){over=true;document.getElementById('status').textContent='Game over — press Restart to try again.'}else{launched=false;ball.vx=0;ball.vy=0;document.getElementById('status').textContent='Life lost. Press Space or click to relaunch.'}}if(bricks.every(b=>!b.alive)){over=true;document.getElementById('status').textContent='You cleared every brick! Press Restart to play again.'}}
function draw(){ctx.fillStyle='#10172a';ctx.fillRect(0,0,720,500);bricks.forEach(b=>{if(!b.alive)return;ctx.fillStyle=b.color;ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,b.h,5);ctx.fill();ctx.fillStyle='#ffffff40';ctx.fillRect(b.x+5,b.y+4,b.w-10,3)});ctx.fillStyle='#7cf0cf';ctx.beginPath();ctx.roundRect(paddle.x,paddle.y,paddle.w,paddle.h,7);ctx.fill();ctx.fillStyle='#fff';ctx.shadowColor='#7c9cff';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;if(!launched||over){ctx.fillStyle='#0b1020bb';ctx.fillRect(0,210,720,70);ctx.textAlign='center';ctx.font='bold 22px system-ui';ctx.fillStyle='#fff';ctx.fillText(over?'ROUND OVER':'PRESS SPACE OR CLICK TO LAUNCH',360,252)}}
function loop(now){const dt=last?Math.min((now-last)/1000,.03):0;last=now;update(dt);draw();raf=requestAnimationFrame(loop)}reset();
</script></body></html>
